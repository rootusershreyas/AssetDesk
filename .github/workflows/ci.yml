name: Rust checks

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: assetdesk
          POSTGRES_PASSWORD: assetdesk_dev
          POSTGRES_DB: assetdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetdesk -d assetdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://assetdesk:assetdesk_dev@127.0.0.1:5432/assetdesk
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit and PostgreSQL integration tests
        run: cargo test --locked
